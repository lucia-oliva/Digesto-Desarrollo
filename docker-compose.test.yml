# Stack aislado para verificar la carga del dump sanitizado desde cero.
# Uso: docker compose -p digesto-test -f docker-compose.test.yml up -d --build
services:
  mariadb:
    image: mariadb:11
    container_name: digesto-test-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: bs_digesto
      MARIADB_USER: digesto
      MARIADB_PASSWORD: digesto
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./Backend
    container_name: digesto-test-backend
    environment:
      DB_HOST: mariadb
      DB_USER: digesto
      DB_PASS: digesto
      DB_NAME: bs_digesto
      PORT: 3000
      NODE_ENV: development
      FRONT_ORIGINS: http://localhost:5173
      ACCESS_SECRET: test-access
      REFRESH_SECRET: test-refresh
    ports:
      - "3000:3000"
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
      - backend_archivos:/app/archivos
      - ./.env:/app/.env:ro
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: ./Digesto
    container_name: digesto-test-frontend
    environment:
      CHOKIDAR_USEPOLLING: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./Digesto:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mariadb_data:
  backend_node_modules:
  backend_archivos:
  frontend_node_modules:
